[project]
name = "ollama-harness-engineering-demo"
version = "0.2.0"
description = "Management demo showing hand-built, SDK-level, and plug-and-play harness engineering patterns."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8.0",
  "pyyaml>=6.0.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]
live = [
  "openai>=1.40.0",
  "ollama>=0.5.0",
  "strands-agents>=1.0.0",
]
maf = [
  "agent-framework>=1.14.0",
  "agent-framework-openai>=1.14.0",
  "agent-framework-orchestrations>=1.1.1",
]

[project.scripts]
harness-demo = "harness_demo.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
