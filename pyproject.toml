[project]
name = "ollama-harness-engineering-demo"
version = "0.1.0"
description = "Demo harness proving a normal model with a strong harness can beat a stronger model with a weak harness."
requires-python = ">=3.11"
dependencies = [
  "ollama>=0.5.0",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]

[project.scripts]
harness-demo = "harness_demo.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
